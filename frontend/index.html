<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#28533e" />
    <script>
      try {
        const saved = localStorage.getItem('wisdom-tree-theme');
        const theme = ['light', 'dark', 'system'].includes(saved) ? saved : 'system';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.colorMode = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.colorMode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <title>智慧树 · 养成与 API</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
